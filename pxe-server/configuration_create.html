<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Configuration</title>
    <script>
        let users = []; // Array to hold fetched users

        // Fetch the list of users from an endpoint
        async function fetchUsers() {
            try {
                const response = await fetch('/users/'); // Endpoint for user list
                users = await response.json(); // Assuming JSON array of users

                const usernameSelect = document.getElementById('username');

                // Populate dropdown
                users.forEach(user => {
                    const option = document.createElement('option');
                    option.value = user.username;
                    option.textContent = user.username;
                    usernameSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Error fetching users:', error);
            }
        }

        // Handle form submission
        async function submitForm(event) {
            event.preventDefault();

            const selectedUser = document.getElementById('username').value;
            const lukpass = document.getElementById('lukpass').value;

            if (!selectedUser) {
                alert("Please select a user.");
                return;
            }

            if (!lukpass) {
                alert("Please enter a password.");
                return;
            }

            try {
                const response = await fetch(`/create-configuration/?username=${encodeURIComponent(selectedUser)}&lukpass=${encodeURIComponent(lukpass)}`, {
                    method: 'GET',
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const data = await response.json();
                alert(data.message);
            } catch (error) {
                console.error('Error:', error);
                alert("An error occurred while creating the configuration.");
            }
        }

        window.onload = fetchUsers;
    </script>
</head>
<body>
    <h2>Create Configuration</h2>
    <form id="userForm" onsubmit="submitForm(event)">
        <label for="username">Username:</label><br>
        <select id="username" name="username" required>
            <option value="" disabled selected>Select a user</option>
        </select><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="lukpass" name="lukpass" required><br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
