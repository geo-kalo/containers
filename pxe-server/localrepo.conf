<VirtualHost *:80>
    #ServerName   localrepo.net
    DocumentRoot /var/www/html/ubuntu/
    <Directory /var/www/html/ubuntu/>
      Options +Indexes +FollowSymLinks +MultiViews
      AllowOverride None
      Require all granted  
    </Directory>
    CustomLog    /var/log/apache2/other_vhosts_access.log combined
</VirtualHost>

