<VirtualHost *:443>
    #ServerName  pxeportal.net
    <Directory /api/>
        Require all granted
    </Directory>

    DocumentRoot /api/
    ErrorLog /api/error.log
    CustomLog /api/requests.log combined

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/api.crt
    SSLCertificateKeyFile /etc/ssl/private/api.key

    WSGIDaemonProcess fastapi python-home=/venv
    WSGIProcessGroup fastapi
    WSGIApplicationGroup %{GLOBAL}
    WSGIScriptAlias / /api/main.py
</VirtualHost>

