[global]
   workgroup = WORKGROUP
   server string = Samba Server
   netbios name = SAMBASERVER
   security = user
   map to guest = Bad User
   dns proxy = no

[win-install]
   path = /srv/nfs/win-install
   browseable = yes
   writable = no
   guest ok = yes
   read only = yes
   force user = nobody
   force group = nogroup
