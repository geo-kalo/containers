<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete User</title>
    <script>
        let users = []; // Array to hold fetched users

        async function fetchUsers() {
            try {
                const response = await fetch('/users/'); // Fetch users from this endpoint
                users = await response.json();
                const usernameSelect = document.getElementById('username');

                users.forEach(user => {
                    const option = document.createElement('option');
                    option.value = user.username; // Ensure the value is set
                    option.textContent = user.username; // Display name in the dropdown
                    usernameSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Error fetching users:', error);
            }
        }

        async function deleteUser(event) {
            event.preventDefault(); // Prevent the default form submission

            const username = document.getElementById('username').value;

            if (!username) {
                alert("Please select a user to delete.");
                return;
            }

            // Send DELETE request with username as a path parameter
            const response = await fetch(`/delete-user/${username}`, {  // Include username in the URL
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json'
                }
            });

            if (response.ok) {
                const result = await response.json();
                alert(result.message); // Show success message
                location.reload(); // Reload the page to refresh user list
            } else {
                const error = await response.json();
                alert(`Error: ${error.detail}`);
            }
        }

        window.onload = fetchUsers; // Fetch users when the page loads
    </script>
</head>
<body>
    <h2>Delete User</h2>
    <form onsubmit="deleteUser(event)">
        <label for="username">Username:</label><br>
        <select id="username" name="user_name" required>
            <option value="" disabled selected>Select a user</option>
            <!-- Options will be populated by JavaScript -->
        </select><br><br>

        <button type="submit">Delete User</button>
    </form>
</body>
</html>
